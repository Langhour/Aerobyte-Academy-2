services:
  - type: web
    name: aerobyte-academy
    runtime: docker
    dockerfilePath: ./hosting/backend.Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: ADMIN_COOKIE_SECURE
        value: "true"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: AeroByte Academy <onboarding@resend.dev>
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        fromService:
          type: web
          name: aerobyte-academy
          envVarKey: RENDER_EXTERNAL_URL
      - key: FRONTEND_ORIGINS
        fromService:
          type: web
          name: aerobyte-academy
          envVarKey: RENDER_EXTERNAL_URL
      - key: AEROBYTE_CONTENT_DB
        value: /app/data/aerobyte-content.sqlite3
