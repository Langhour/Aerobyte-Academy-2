    let activeSheet = "Instructions & Summary";

    function renderTabs() {
      const container = document.getElementById('tabsContainer');
      container.innerHTML = '';
      Object.keys(data).forEach(sheetName => {
        const btn = document.createElement('button');
        const isActive = (sheetName === activeSheet);
        btn.className = `px-3 py-1.5 rounded-t text-xs font-semibold transition shrink-0 whitespace-nowrap cursor-pointer ${
          isActive 
            ? 'bg-white text-[#102a49] shadow-sm border-t-2 border-[#102a49]' 
            : 'bg-slate-100 text-slate-600 hover:bg-slate-50 hover:text-slate-900'
        }`;
        btn.textContent = sheetName;
        btn.onclick = () => switchSheet(sheetName);
        container.appendChild(btn);
      });
    }

    function switchSheet(sheetName) {
      activeSheet = sheetName;
      document.getElementById('searchInput').value = '';
      renderTabs();
      renderTable();
    }

    function renderTable() {

        if (h && h.includes("EDIT HERE")) {
          th.className += " bg-emerald-700 text-emerald-50";
        }
        th.textContent = h;
        trHead.appendChild(th);
      });
      thead.appendChild(trHead);

      rows.forEach((row, rIdx) => {
        const tr = document.createElement('tr');
        tr.className = (rIdx % 2 === 0) ? 'bg-white hover:bg-slate-50' : 'bg-slate-50/60 hover:bg-slate-100/70';
        tr.setAttribute('data-search', row.join(' ').toLowerCase());

        row.forEach((cellVal, cIdx) => {
          const td = document.createElement('td');
          td.className = "px-3 py-2 border-r border-slate-200 last:border-r-0 align-top text-xs";

          // If Column E (Index 4) in page sheets
          if (cIdx === 4 && activeSheet !== "Instructions & Summary") {
            td.className += " bg-emerald-50/70 border-emerald-200 khmer-font font-medium text-emerald-950";
            td.setAttribute('contenteditable', 'true');
            td.setAttribute('placeholder', 'Type correction...');
            td.textContent = cellVal;
            td.onblur = () => {
              data[activeSheet][rIdx + 1][cIdx] = td.textContent;
            };
          } else {
            // Is Khmer column? (Index 3)
            if (cIdx === 3 && activeSheet !== "Instructions & Summary") {
              td.className += " khmer-font text-slate-800";
            }
            td.textContent = cellVal;
          }
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
    }

    function filterRows() {
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      const trs = document.getElementById('tableBody').querySelectorAll('tr');
      trs.forEach(tr => {
        const text = tr.getAttribute('data-search') || '';
        tr.style.display = text.includes(q) ? '' : 'none';
      });
    }

    renderTabs();
    renderTable();
  </script>
</body>
</html>
